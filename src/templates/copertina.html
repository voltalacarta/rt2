{% macro copertina(c, id="anteprima", grande=false) %}
<figure class="libro{% if grande %} libro--grande{% endif %}" id="{{ id }}" data-finitura="{{ c.finitura|lower|replace(' ', '-') }}" style="--cop: {{ c.colore }}; --foil: #C9A24A;">
  <div class="libro__corpo" aria-hidden="true">
    <div class="libro__dorso"></div>
    <div class="libro__piatto">
      <svg class="libro__decoro" viewBox="0 0 200 280" preserveAspectRatio="none" hidden>
        <g fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="12" y="12" width="176" height="256" />
          <rect x="17" y="17" width="166" height="246" stroke-width=".6" />
          <path d="M12 40 C 28 38 38 28 40 12 M188 40 C 172 38 162 28 160 12 M12 240 C 28 242 38 252 40 268 M188 240 C 172 242 162 252 160 268" />
          <circle cx="26" cy="26" r="3" /><circle cx="174" cy="26" r="3" /><circle cx="26" cy="254" r="3" /><circle cx="174" cy="254" r="3" />
        </g>
      </svg>
      <p class="libro__ateneo" data-campo="ateneo">Università degli Studi</p>
      <p class="libro__titolo" data-campo="titolo">Titolo della tesi</p>
      <p class="libro__nome" data-campo="nome">Nome Cognome</p>
      <p class="libro__anno" data-campo="anno">Anno accademico 2025/2026</p>
    </div>
  </div>
  <figcaption class="libro__didascalia"><span data-campo="copertina">{{ c.nome }}</span>, <span data-campo="prezzo">{{ c.prezzo|euro }}</span></figcaption>
</figure>
{% endmacro %}
