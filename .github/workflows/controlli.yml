name: Controlli documentazione

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  formato:
    name: Formato Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"

  link:
    name: Link interni
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments "**/*.md"
          fail: true

  metadati:
    name: Metadati dei documenti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Frontmatter, stati, date, numeri delle decisioni
        run: python strumenti/controlla.py
